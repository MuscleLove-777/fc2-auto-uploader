name: Cloud Uploader Daily Self Monitor
on:
  schedule:
    - cron: '43 12 * * *'
  workflow_dispatch:
permissions:
  actions: write
  contents: write
concurrency:
  group: daily-cloud-uploader-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect publisher and recover disabled workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python cloud_workflow_guard.py
      - name: Preserve real daily observation
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f cloud_guard_latest.json
          git diff --cached --quiet || git commit -m 'auto: daily publisher health [skip ci]'
          git pull --rebase --autostash
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-uploader-daily-health
          path: cloud_guard_latest.json
          retention-days: 30
